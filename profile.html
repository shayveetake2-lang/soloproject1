<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2efe9" />
    <title>Veloce — Edit profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="hero-overrides.css" />
  </head>
  <body class="profile-page">
    <main class="profile-directory">
      <header class="routes-header"><a class="back-link" href="index.html">← Discover</a><div class="breadcrumb">ACCOUNT / <span>EDIT PROFILE</span></div><span class="route-count">SIGNED IN</span></header>
      <section class="profile-edit-shell"><div class="profile-edit-heading"><p class="eyebrow">YOUR VELOCE ACCOUNT</p><h1>Edit your<br /><em>profile.</em></h1><span id="profileStatus">Your profile details sync automatically.</span><div class="own-info" id="ownInfo"></div></div><form id="profileForm" class="car-form profile-form"><label>YOUR NAME<input id="editName" type="text" required /></label><label>USERNAME<input id="editUsername" type="text" minlength="3" required /></label><label>EMAIL<input id="editEmail" type="email" required /></label><label>LOCATION<input id="editLocation" type="text" required /></label><button class="native-share" type="submit">Save profile <span>→</span></button></form></section>
    </main>
    <div class="toast" id="profileToast">Profile saved</div>
    <script type="module">
      import { storage } from './src/storage.js';

      let users = JSON.parse(localStorage.getItem('veloceUsers') || '[]');
      let sessionEmail = localStorage.getItem('veloceSessionEmail');
      try {
        const state = await storage.load();
        if (Array.isArray(state.veloceUsers)) users = state.veloceUsers;
        if (state.veloceSessionEmail) sessionEmail = state.veloceSessionEmail;
      } catch (error) {
        console.warn('Firestore storage unavailable; using local data.', error);
      }
      const currentUser = users.find((user) => user.email === sessionEmail);
      const form = document.querySelector('#profileForm');
      const toast = document.querySelector('#profileToast');
      if (!currentUser) {
        window.location.href = 'index.html';
      } else {
        document.querySelector('#editName').value = currentUser.name || '';
        document.querySelector('#editUsername').value = currentUser.username || '';
        document.querySelector('#editEmail').value = currentUser.email || '';
        document.querySelector('#editLocation').value = currentUser.location || 'Auckland, NZ';
        const car = currentUser.car;
        const latestService = car?.serviceHistory?.at(-1);
        document.querySelector('#ownInfo').innerHTML = `<p class="eyebrow">STORED ACCOUNT INFO</p><div class="own-info-grid"><div><strong>${car ? car.model : 'No car added'}</strong><span>GARAGE CAR</span></div><div><strong>${car?.year || '—'}</strong><span>CAR YEAR</span></div><div><strong>${car?.colour || '—'}</strong><span>COLOUR</span></div><div><strong>${car?.oilKm || '—'}</strong><span>KM SINCE OIL</span></div><div><strong>${car?.odometer || '—'}</strong><span>ODOMETER KM</span></div><div><strong>${(currentUser.carPhotos || []).length}</strong><span>CAR PHOTOS</span></div><div><strong>${car?.nextService?.task || '—'}</strong><span>NEXT SERVICE</span></div><div><strong>${car?.nextService?.dueKm || '—'}</strong><span>NEXT SERVICE KM</span></div><div><strong>${car?.serviceHistory?.length || 0}</strong><span>SERVICE RECORDS</span></div><div><strong>${latestService?.note || '—'}</strong><span>LATEST SERVICE NOTES</span></div></div>`;
      }
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const oldEmail = currentUser.email;
        currentUser.name = document.querySelector('#editName').value.trim();
        currentUser.username = document.querySelector('#editUsername').value.trim().toLowerCase();
        currentUser.email = document.querySelector('#editEmail').value.trim().toLowerCase();
        currentUser.location = document.querySelector('#editLocation').value.trim();
        localStorage.setItem('veloceUsers', JSON.stringify(users));
        if (oldEmail !== currentUser.email) localStorage.setItem('veloceSessionEmail', currentUser.email);
        try {
          await storage.set('veloceUsers', users);
          if (oldEmail !== currentUser.email) await storage.set('veloceSessionEmail', currentUser.email);
        } catch (error) {
          console.warn('Firestore storage unavailable; saved locally.', error);
        }
        toast.textContent = 'Profile saved';
        toast.classList.add('show');
        setTimeout(() => { window.location.href = 'index.html'; }, 700);
      });
    </script>
  </body>
</html>
